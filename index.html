<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- ===== DASHBOARD ===== -->
  <header class="dashboard">
    <h1>Job Application Tracker</h1>

    <div class="stats">
      <div class="card">
        <h3>Total</h3>
        <p id="totalCount">0</p>
      </div>

      <div class="card">
        <h3>Interview</h3>
        <p id="interviewCount">0</p>
      </div>

      <div class="card">
        <h3>Rejected</h3>
        <p id="rejectedCount">0</p>
      </div>
    </div>
  </header>

  <!-- ===== JOB SECTION ===== -->
  <section class="jobs-section">

    <div class="jobs-header">
      <h2>Available Jobs</h2>
      <span id="tabCount">0 jobs</span>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="all">All</button>
      <button class="tab" data-tab="interview">Interview</button>
      <button class="tab" data-tab="rejected">Rejected</button>
    </div>

    <!-- Job cards will be inserted here by JavaScript -->
    <div id="jobList" class="job-list"></div>

    <!-- Empty state -->
    <div id="emptyState" class="empty">
      <h3>No jobs available</h3>
      <p>Check back later for new opportunities.</p>
    </div>

  </section>

  <script src="./script.js"></script>
</body>
</html>
