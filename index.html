<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="dashboard">
    <h1>Job Application Tracker</h1>

    <div class="stats">
      <div class="card">
        <h3>Total Jobs</h3>
        <p id="totalCount">0</p>
      </div>
      <div class="card">
        <h3>Interview</h3>
        <p id="interviewCount">0</p>
      </div>
      <div class="card">
        <h3>Rejected</h3>
        <p id="rejectedCount">0</p>
      </div>
    </div>
  </header>

  <section class="jobs-section">

    <div class="jobs-header">
      <h2>Available Jobs</h2>
      <span id="tabCount">0 jobs</span>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="all">All</button>
      <button class="tab" data-tab="interview">Interview</button>
      <button class="tab" data-tab="rejected">Rejected</button>
    </div>

    <div id="jobList" class="job-list"></div>

    <div id="emptyState" class="empty">
  <img src="jobs.png" alt="No jobs" class="empty-img">
  <h3>No jobs available</h3>
  <p>There are no jobs in this section right now</p>
</div>

  </section>

  <script src="script.js"></script>
</body>
</html>
